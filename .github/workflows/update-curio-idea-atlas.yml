name: Update Curio Idea Atlas (semantic)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish manually curated Curio Book Atlas"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '**/*.xlsx'
      - 'docs/**/*.json'
      - '!docs/curio-idea-atlas-data.json'
      - 'tools/build_curio_semantic_map.py'
      - 'tools/build_curio_idea_map.py'
      - 'tools/curio-idea-atlas.template.html'
      - 'tools/camel-book-sea.webp'
      - 'tools/semantic-requirements.txt'
      - '.github/workflows/update-curio-idea-atlas.yml'

permissions:
  contents: write
concurrency:
  group: curio-idea-atlas
  cancel-in-progress: false

jobs:
  semantic-map:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/semantic-requirements.txt
      - name: Cache multilingual model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-multilingual-minilm-l12-v2
      - name: Install semantic dependencies
        run: python -m pip install -r tools/semantic-requirements.txt
      - name: Build multilingual semantic atlas
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python tools/build_curio_semantic_map.py --backend semantic --out docs/curio-idea-atlas.html
      - name: Commit updated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/curio-idea-atlas.html docs/curio-idea-atlas-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update semantic idea atlas"
            git push
          fi

